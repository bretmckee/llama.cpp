version = 1

[*]
n-gpu-layers = 99
stop-timeout = 30
mmap = true
models-max = 1
parallel = 1
models-autoload = true

########################################################################
[Qwen3.8-27B-thinking]
model = /home/mckee/models/qwen/3.8/27b/Qwen3.8-27B-Unsloth-NVFP4-Q8.gguf
mmproj = /home/mckee/models/qwen/3.8/27b/mmproj-F16.gguf
ctx-size = 131072
n-predict = 8192
flash-attn = true

# speculative decoding (MTP)
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.75

# cap thinking length
reasoning-budget = 2048
reasoning-effort = low

# sampling (Qwen thinking-model recommended)
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.05
presence-penalty = 0.0
repeat-penalty = 1.1
repeat-last-n = 256

# KV cache
cache-type-k = q8_0
cache-type-v = q8_0

# Process tokens in small batches to work around a llama.cpp bug
batch-size = 512
ubatch-size = 512

jinja = true

########################################################################
